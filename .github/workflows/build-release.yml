name: build-release

on:
  workflow_dispatch:
    inputs:
      publish:
        required: true
        type: boolean
        default: true
        description: 'Whether to publish the built artifacts'
      version-type:
        required: true
        type: choice
        default: 'release'
        options:
          - release
          - beta
          - alpha
        description: 'Publishing version type'
      publish-platform:
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - modrinth
          - curseforge
          - github
        description: 'Platforms to publish to (GitHub Releases is always included)'
      changelog-text:
        required: false
        type: string
        description: 'Changelog: Input multiple lines, use `\\n`. (supports markdown)'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Build and Publish
        run: ./gradlew publishMods
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_TEXT: ${{ inputs.changelog-text }}
          VERSION_TYPE: ${{ inputs.version-type }}
          PUBLISH_ENABLED: ${{ inputs.publish }}
          PUBLISH_PLATFORM: ${{ inputs.publish-platform }}
